[build-system]
requires = ["hatchling>=1.25", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "rendeer"
version = "0.1.0"
description = "Composable scientific figures with explicit statistical semantics and rendered quality checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["matplotlib>=3.8,<4", "numpy>=1.24,<3", "pandas>=2,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/jmtitan/rendeer"
Issues = "https://github.com/jmtitan/rendeer/issues"

[project.optional-dependencies]
stats = ["scipy>=1.10"]
dev = ["rendeer[stats]", "pytest>=8", "ruff", "mypy", "build", "hatchling", "editables", "twine", "nbformat", "nbclient", "ipykernel", "pillow", "pypdf"]

[tool.hatch.build]
ignore-vcs = true
exclude = [".git", "__pycache__", "*.pyc", ".pytest_cache", ".mypy_cache", ".ruff_cache", "dist", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/rendeer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/rendeer"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true

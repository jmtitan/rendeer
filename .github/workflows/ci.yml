name: package-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            matplotlib: '3.8.4'
            pyparsing: '3.2.5'
            numpy: '1.26.4'
          - python: '3.12'
            matplotlib: '3.10.8'
            pyparsing: '3.3.3'
            numpy: '1.26.4'
          - python: '3.12'
            matplotlib: '3.11.2'
            pyparsing: '3.3.3'
            numpy: '2.5.4'
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Keep generated files outside the checkout
        shell: bash
        run: |
          echo "RENDEER_TEST_OUTPUT=$RUNNER_TEMP/rendeer" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/rendeer/mpl" >> "$GITHUB_ENV"
          echo "MYPY_CACHE_DIR=$RUNNER_TEMP/rendeer/mypy" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$RUNNER_TEMP/rendeer/ruff" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install uv
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e '.[dev]' 'numpy==${{ matrix.numpy }}' 'matplotlib==${{ matrix.matplotlib }}' 'pyparsing==${{ matrix.pyparsing }}'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: python -m pytest -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" --junitxml="$RENDEER_TEST_OUTPUT/pytest.xml"
      - name: Lint and types
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
          python -m mypy
      - name: Smoke and gallery
        run: |
          python examples/gallery.py --only line --output "$RENDEER_TEST_OUTPUT/smoke"
          python examples/gallery.py --output "$RENDEER_TEST_OUTPUT/gallery"
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          python -m twine check "$RUNNER_TEMP"/dist/*
